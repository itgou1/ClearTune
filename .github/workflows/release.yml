name: Publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLEARTUNE_RELEASE_STORE_FILE: ${{ runner.temp }}/cleartune-release.jks
      CLEARTUNE_RELEASE_STORE_PASSWORD: ${{ secrets.CLEARTUNE_RELEASE_STORE_PASSWORD }}
      CLEARTUNE_RELEASE_KEY_ALIAS: ${{ secrets.CLEARTUNE_RELEASE_KEY_ALIAS }}
      CLEARTUNE_RELEASE_KEY_PASSWORD: ${{ secrets.CLEARTUNE_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEARTUNE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$CLEARTUNE_RELEASE_STORE_PASSWORD"
          test -n "$CLEARTUNE_RELEASE_KEY_ALIAS"
          test -n "$CLEARTUNE_RELEASE_KEY_PASSWORD"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEARTUNE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CLEARTUNE_RELEASE_STORE_FILE"

      - name: Validate tag and read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' app/build.gradle.kts | head -n 1)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test "$TAG_VERSION" = "$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=ClearTune-$GITHUB_REF_NAME.apk" >> "$GITHUB_OUTPUT"
          echo "aab_name=ClearTune-$GITHUB_REF_NAME.aab" >> "$GITHUB_OUTPUT"

      - name: Test, lint and build release
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${{ steps.version.outputs.apk_name }}"
          cp app/build/outputs/bundle/release/app-release.aab "dist/${{ steps.version.outputs.aab_name }}"
          python3 .github/scripts/create_update_manifest.py \
            --apk "dist/${{ steps.version.outputs.apk_name }}" \
            --output dist/update.json \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --version-name "${{ steps.version.outputs.version_name }}" \
            --tag "$GITHUB_REF_NAME"
          cd dist
          sha256sum "${{ steps.version.outputs.apk_name }}" > "${{ steps.version.outputs.apk_name }}.sha256"
          sha256sum "${{ steps.version.outputs.aab_name }}" > "${{ steps.version.outputs.aab_name }}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "ClearTune ${{ steps.version.outputs.version_name }}"

      - name: Remove signing key
        if: always()
        run: rm -f "$CLEARTUNE_RELEASE_STORE_FILE"
