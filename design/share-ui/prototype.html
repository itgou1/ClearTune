@media(max-width:360px){#ct-share-design .ct-sheet{padding-left:16px;padding-right:16px}#ct-share-design .ct-content{padding-left:16px;padding-right:16px}#ct-share-design .ct-preview-nav{gap:6px}#ct-share-design .ct-summary strong{font-size:15px}#ct-share-design .ct-meta-row{font-size:12px}}

<script>
(() => {
const root=document.getElementById('ct-share-design');
const app=root.querySelector('#ct-app');
const picker=root.querySelector('#ct-scene');
const phone=root.querySelector('#ct-phone');
const saved=window.openai?.widgetState?.privateContent;
let scene=saved?.scene || 'album', kind=saved?.kind || 'playlist', days=saved?.days || 7, desc=saved?.desc || '';
let revoked=false, selectedRecord=0, toastTimer;
const tuning={sheetRadius:28, surface:'auto'};
const scenes=Array.from(picker.options).map(o=>o.value);
if(!scenes.includes(scene))scene='album';
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const art=(k='album',mini=false)=>`<div class="ct-art ${k==='playlist'?'playlist':''} ${mini?'mini':''}" role="img" aria-label="演示封面：抽象山丘与日落"><span class="ct-sun"></span><span class="ct-cover-type">${k==='playlist'?'ON THE WAY':'STILL / 2026'}</span></div>`;
const data=()=>kind==='album'?{name:'山海之间',by:'林间回声',type:'专辑',count:'8 首歌曲'}:kind==='song'?{name:'晚风经过',by:'林间回声 · 山海之间',type:'歌曲',count:'单曲'}:{name:'通勤路上',by:'demo 创建',type:'歌单',count:'12 首歌曲'};
const summary=()=>{const d=data();return `<div class="ct-summary">${art(kind,true)}<div class="ct-grow"><strong>${d.name}</strong><div class="ct-small">${d.type} · ${d.count}</div></div></div>`;};
const status=()=>`<div class="ct-status"><span>9:41</span><span class="ct-status-right">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div>`;
const top=(title='',action='')=>`${status()}<div class="ct-top"><button class="ct-icon cursor-interaction" data-act="back" aria-label="返回">${icon('arrow-left')}</button><div class="ct-top-title">${title}</div>${action}</div>`;
const shareAction=k=>`<button class="ct-icon ct-share-icon cursor-interaction" data-act="share-${k}" aria-label="分享${k==='album'?'专辑':'歌单'}">${icon('share-2')}</button>`;
function detail(k='album'){
const isList=k==='playlist';
return `${top('',shareAction(k))}<div class="ct-content">${art(k)}<div class="ct-title-row"><h2>${isList?'通勤路上':'山海之间'}</h2><button class="ct-icon ct-tonal cursor-interaction" data-act="demo" aria-label="${isList?'重命名':'收藏专辑'}">${icon(isList?'pencil':'heart')}</button></div><p class="ct-sub">${isList?'demo · 12 首歌曲':'林间回声 · 2026 · 8 首歌曲'}</p><div class="ct-actions"><button class="ct-btn ct-primary cursor-interaction" data-act="demo">${icon('play')}播放全部</button><button class="ct-btn cursor-interaction" data-act="demo">${icon('download')}下载</button>${isList?`<button class="ct-icon cursor-interaction" data-act="demo" aria-label="添加歌曲">${icon('list-plus')}</button>`:''}</div>${['晚风经过','穿过城市的光','缓慢的晴天','沿途'].map((name,i)=>`<div class="ct-song-row"><span class="ct-song-num">${String(i+1).padStart(2,'0')}</span><div class="ct-grow"><div>${name}</div><div class="ct-small">林间回声</div></div><button class="ct-icon cursor-interaction" data-act="song-menu" aria-label="${name}更多选项">${icon('ellipsis-vertical')}</button></div>`).join('')}</div>`;
}
function sheet(inner){return `<div class="ct-sheet-host"><div class="ct-background">${top()}${art(kind)}</div><div class="ct-scrim"></div><section class="ct-sheet" aria-label="分享面板"><div class="ct-handle"></div>${inner}</section></div>`;}
const heading=t=>`<div class="ct-sheet-heading"><h3>${t}</h3><button class="ct-icon cursor-interaction" data-act="close" aria-label="关闭分享面板">${icon('x')}</button></div>`;
const periods=()=>`<div class="ct-periods">${[1,7,30].map(n=>`<button class="cursor-interaction" data-days="${n}" aria-pressed="${days===n}">${days===n?'✓ ':''}${n} 天</button>`).join('')}</div>`;
function form(edit=false){return sheet(`${heading(edit?'编辑分享':'分享'+data().type)}${summary()}<label class="ct-field-label" for="ct-description">分享说明 <span>可选</span></label><textarea id="ct-description" maxlength="200" placeholder="写一句推荐语（可选）">${escape(desc)}</textarea><div class="ct-field-label">${edit?'新的有效期':'有效期'}</div>${periods()}${edit?'<p class="ct-small" style="margin-top:10px">从保存时开始计算，分享链接保持不变。</p>':kind==='playlist'?`<div class="ct-note">${icon('list-music')}<span>分享当前的 12 首歌曲，后续修改不会同步。</span></div>`:'<div style="height:12px"></div>'}<p class="ct-footnote">拥有链接的人可在有效期内访问，无需登录。</p><button class="ct-btn ct-primary ct-full cursor-interaction" data-act="${edit?'save':'generate'}">${edit?'保存修改':'生成分享链接'}</button>`);}
function success(){return sheet(`${heading('分享'+data().type)}<div class="ct-success-mark">${icon('check')}</div><h2 class="ct-center">链接已生成</h2><p class="ct-small ct-center">有效期至 ${expiry()}</p><div style="margin-top:24px">${summary()}</div><div class="ct-link-box">https://music.example.com/share/DEMO123</div><button class="ct-btn ct-primary ct-full cursor-interaction" data-act="send">${icon('share-2')}分享链接</button><p class="ct-small ct-center">在系统分享中选择微信或其他应用</p><button class="ct-btn ct-full cursor-interaction" data-act="copy">${icon('copy')}复制链接</button><button class="ct-text-button cursor-interaction" data-act="manage">管理此分享 ${icon('chevron-right')}</button>`);}
function expiry(){return days===1?'2026-09-25 09:41':days===30?'2026-10-24 09:41':'2026-10-01 09:41';}
const setting=(ic,title,sub,act='demo')=>`<button class="ct-setting cursor-interaction" data-act="${act}"><span class="ct-icon">${icon(ic)}</span><div class="ct-grow"><div>${title}</div>${sub?`<div class="ct-small">${sub}</div>`:''}</div>${icon('chevron-right')}</button>`;
function my(empty=false){
 const count=records.filter((r,i)=>!revoked||i!==0).length;
 return `${status()}<div class="ct-content">
 <h2 style="margin:18px 0 22px">我的</h2>
 <div class="ct-my-profile"><span class="ct-my-avatar">${icon('circle-user-round')}</span><div class="ct-grow"><strong>demo</strong><div class="ct-small">🟢 Navidrome 已连接</div></div><button class="ct-my-gear cursor-interaction" data-act="demo" aria-label="设置">${icon('settings')}</button></div>
 <div class="ct-my-features"><button class="ct-my-feature cursor-interaction" data-act="demo"><span class="ct-icon">${icon('chart-no-axes-combined')}</span><strong>听歌报告</strong><span>回顾你的聆听</span></button><button class="ct-my-feature cursor-interaction" data-act="demo"><span class="ct-icon">${icon('heart')}</span><strong>喜欢的音乐</strong><span>42 首歌曲</span></button></div>
 <div class="ct-section-label" style="margin-top:10px">离线与下载</div><div class="ct-my-downloads"><button class="cursor-interaction" data-act="demo"><span class="ct-icon">${icon('circle-check')}</span><span class="ct-grow"><strong>离线音乐</strong><span class="ct-small">12 首歌曲</span></span></button><button class="cursor-interaction" data-act="demo"><span class="ct-icon">${icon('download')}</span><span class="ct-grow"><strong>下载管理</strong><span class="ct-small">2 个任务</span></span></button></div>
 <div class="ct-my-playlist-heading"><strong>歌单</strong><span class="ct-my-count">1</span><button class="ct-my-create cursor-interaction" data-act="demo">＋ 新建歌单</button></div><button class="ct-my-playlist cursor-interaction" data-act="demo">${art('playlist',true)}<span class="ct-grow">通勤路上<span class="ct-small" style="display:block">12 首歌曲</span></span>${icon('chevron-right')}</button>
 ${empty?'':`<div class="ct-my-share-label">分享</div><div class="ct-group">${setting('share-2','我的分享',count+' 条链接 · 管理有效期','list')}</div>`}
 </div>`;
}
const records=[{name:'通勤路上',k:'playlist',type:'歌单快照 · 12 首',date:'10 月 1 日 09:41 到期',visits:'访问 3 次'},{name:'山海之间',k:'album',type:'专辑 · 8 首',date:'10 月 22 日 14:20 到期',visits:'访问 8 次'},{name:'晚风经过',k:'song',type:'歌曲 · 林间回声',date:'9 月 20 日已到期',visits:'访问 2 次',expired:true}];
function list(empty=false){return `${top('我的分享')}<div class="ct-content"><div class="ct-sub">当前账号创建的链接</div>${empty?`<div class="ct-empty"><div class="ct-success-mark">${icon('link')}</div><h3>还没有分享</h3><p class="ct-sub">从歌曲、专辑或歌单<br>创建第一条链接</p></div>`:records.filter((r,i)=>!revoked||i!==0).map((r,i)=>`<button class="ct-share-card cursor-interaction" data-record="${records.indexOf(r)}"><div class="ct-summary">${art(r.k,true)}<div class="ct-grow"><strong>${r.name}</strong><span class="ct-small">${r.type}</span></div>${icon('chevron-right')}</div><div class="ct-meta-line"><span class="ct-badge ${r.expired?'expired':''}">${r.expired?'已过期':'生效中'}</span><span class="ct-small">${r.visits}</span></div><p class="ct-small" style="margin-top:12px">${r.date}</p></button>`).join('')}</div>`;}
function manage(){const expired=records[selectedRecord]?.expired;return `${top('分享详情')}<div class="ct-content" style="padding-top:22px">${summary()}<span class="ct-badge ${expired?'expired':''}">${expired?'已过期':'生效中'}</span><div class="ct-link-box">https://music.example.com/share/DEMO123</div><div class="ct-meta-row"><span>有效期至</span><span>${expired?'2026-09-20 09:41':expiry()}</span></div><div class="ct-meta-row"><span>创建时间</span><span>2026-09-24 09:41</span></div><div class="ct-meta-row"><span>访问次数</span><span>3 次</span></div><div class="ct-meta-row"><span>分享说明</span><span>${escape(desc||'未填写')}</span></div>${kind==='playlist'?`<div class="ct-note">${icon('list-music')}<span>已分享创建时的 12 首歌曲。</span></div>`:''}${expired?'<p class="ct-footnote">链接已到期，修改有效期后可再次分享。</p>':`<button class="ct-btn ct-primary ct-full cursor-interaction" data-act="send">${icon('share-2')}分享链接</button><button class="ct-btn ct-full cursor-interaction" data-act="copy">${icon('copy')}复制链接</button>`}<button class="ct-text-button cursor-interaction" data-act="edit">${icon('pencil')}${expired?'编辑有效期':'编辑分享'}</button><button class="ct-text-button ct-danger cursor-interaction" data-act="revoke">${icon('link-2-off')}取消分享</button></div>`;}
function song(){kind='song';return sheet(`${heading('晚风经过')}<div class="ct-small" style="margin-bottom:16px">林间回声 · 山海之间</div>${[['list-end','下一首播放','demo'],['heart','喜欢歌曲','demo'],['list-plus','加入歌单','demo'],['download','下载歌曲','demo'],['share-2','分享歌曲','share-song'],['info','歌曲详情','demo']].map(([ic,t,a])=>`<button class="ct-menu-row cursor-interaction ${a==='share-song'?'selected':''}" data-act="${a}">${icon(ic)}${t}</button>`).join('')}`);}
function error(){return sheet(`${heading('分享'+data().type)}${summary()}<div class="ct-empty" style="padding:30px 0 60px"><div class="ct-success-mark">${icon('link-2-off')}</div><h3>当前服务器未开启分享</h3><p class="ct-sub">请联系服务器管理员开启分享功能。</p></div><button class="ct-btn ct-primary ct-full cursor-interaction" data-act="close">知道了</button>`);}
function render(){
picker.value=scene;
root.querySelector('#ct-toast').hidden=true;
if(scene==='album'||scene==='playlist')app.innerHTML=detail(scene);
else if(scene==='song')app.innerHTML=song();
else if(scene==='create')app.innerHTML=form();
else if(scene==='success')app.innerHTML=success();
else if(scene==='my'||scene==='empty')app.innerHTML=my(scene==='empty');
else if(scene==='list')app.innerHTML=list();
else if(scene==='manage')app.innerHTML=manage();
else if(scene==='edit')app.innerHTML=form(true);
else if(scene==='revoke')app.innerHTML=manage()+`<div class="ct-dialog-wrap"><section class="ct-dialog" role="dialog" aria-modal="true" aria-labelledby="ct-revoke-title"><h2 id="ct-revoke-title">取消这条分享？</h2><p>取消后，这个链接将无法访问。<br>已发送的消息不会被删除。</p><div class="ct-dialog-buttons"><button class="cursor-interaction" data-act="manage">保留链接</button><button class="ct-danger cursor-interaction" data-act="confirm-revoke">取消分享</button></div></section></div>`;
else app.innerHTML=error();
root.querySelectorAll('.ct-sheet').forEach(el=>el.style.borderRadius=`${tuning.sheetRadius}px ${tuning.sheetRadius}px 0 0`);
root.style.colorScheme=tuning.surface==='auto'?'light dark':tuning.surface;
if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:22,height:22}});
}
function persist(){window.openai?.setWidgetState?.({modelContent:{design:'ClearTune 分享',page:scene,kind,days},privateContent:{scene,kind,days,desc}})?.catch(()=>{});}
function go(next){scene=next;render();persist();}
function toast(text){const el=root.querySelector('#ct-toast');clearTimeout(toastTimer);el.textContent=text;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,2800);}
picker.addEventListener('change',()=>{kind='playlist';selectedRecord=0;go(picker.value);});
root.addEventListener('input',e=>{if(e.target.id==='ct-description')desc=e.target.value;});
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
if(b.dataset.days){const ta=root.querySelector('textarea');if(ta)desc=ta.value;days=Number(b.dataset.days);render();persist();return;}
if(b.dataset.record!==undefined){selectedRecord=Number(b.dataset.record);kind=records[selectedRecord].k;go('manage');return;}
const a=b.dataset.act;if(!a)return;
if(a.startsWith('share-')){kind=a.slice(6);go('create');}
else if(a==='generate'){selectedRecord=0;go('success');}
else if(a==='song-menu')go('song');
else if(a==='copy')toast('演示：链接已复制（未写入真实剪贴板）');
else if(a==='send')toast('演示：这里打开系统分享面板，可选择微信；未实际发送');
else if(a==='save'){if(records[selectedRecord])records[selectedRecord].expired=false;go('manage');toast('演示：修改已保存，链接保持不变');}
else if(a==='confirm-revoke'){revoked=true;go('list');toast('演示：分享已取消');}
else if(a==='close')go(scene==='edit'?'manage':scene==='song'?'album':kind==='song'?'song':kind);
else if(a==='back')go(['manage','edit','revoke'].includes(scene)?'list':scene==='list'?'my':'album');
else if(['list','manage','edit','revoke'].includes(a))go(a);
else toast('此处保留现有功能，本稿仅演示分享流程');
});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&scenes.includes(s.scene)){scene=s.scene;kind=s.kind||'playlist';days=s.days||7;desc=s.desc||'';render();}});
render();
if(globalThis.Tweak){const t=new Tweak({container:phone,onChange:render});t.addSelect(tuning,'surface',{label:'外观',options:[{label:'跟随系统',value:'auto'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});t.addSlider(tuning,'sheetRadius',{label:'面板圆角',min:20,max:32,step:4,unit:'dp'});}
})();
</script>
